name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [macOS Apple Silicon, macOS Intel, Windows x64]
    validations: { required: true }
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 14.5 / Windows 11 23H2
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Grizzly version
      placeholder: 1.3.0
    validations: { required: true }
  - type: textarea
    id: sample
    attributes:
      label: Sample file or steps
      description: Attach a minimal file that reproduces the problem. Do not attach files with private data.
