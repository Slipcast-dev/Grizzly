name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build macOS app
        run: ./scripts/build-app.sh

  electron:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - run: npm ci
      - name: Syntax check
        run: |
          for f in main.js preload.js renderer/*.js scripts/*.js; do node --check "$f"; done
      - name: Audit runtime-relevant dependencies
        run: npm audit --audit-level=high --omit=dev
